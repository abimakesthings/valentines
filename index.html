<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <title>Let's bake!</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Indie+Flower&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css" />
  </head>

  <body>
    <main id="app" >
      <section id="wall-container">
       <img id="background-left" src="background-left.PNG"/>
        <img id="window" src="window.PNG"/>
       </div> 
      

      </section>
      <section id="counter-container">
        <img id="counter" src="counter.PNG"/>
      </section>
      <section id="inventory">
        <div class="inventory-slot">
          <div class="inventory-item-container">
            <img class="inventory-item" id="inventory-dough" src="inventory-dough.PNG"/>
          </div>
          <p class="inventory-label">Dough</p>
        </div>
        <div class="inventory-slot">
          <div class="inventory-item-container">
            <img class="inventory-item" id="inventory-strawberry" src="inventory-strawberry.PNG"/>
          </div>
          <p class="inventory-label">Straw-<br>berries</p>
        </div>
        <div class="inventory-slot">
          <div class="inventory-item-container">
            <img class="inventory-item" id="inventory-butter" src="inventory-butter.PNG"/>
            </div>
          <p class="inventory-label">Butter</p>
        </div>
        <div class="inventory-slot">
          <div class="inventory-item-container">
            <img class="inventory-item" id="inventory-sugar" src="inventory-sugar.PNG"/>
          </div>
          <p class="inventory-label">Sugar</p>
        </div>
      </section>
    </main>
  </body>
</html>
